<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>
<body style="background-color: #C7D3C0;">
    <center><h1>YOUR VEHICLE ON YOUR WAY</h1></center>
   <div style="width: 1500px;" class="containere">
    <div class="carimage d-flex justify-content-center ">
         <div id="carouselExampleControls" class="carousel slide w-50" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="./images/innova-front.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="./images/innova-left.avif" class="d-block w-80" alt="...">
    </div>
    <div class="carousel-item">
      <img src="./images/innova-backside.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="./images/innova-side.jpeg" class="d-block w-100 justify-content-center " alt="...">
    </div>
  </div>
  <button class="carousel-control-prev " type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
    <span class="carousel-control-prev-icon " aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>

    </div>

    <div class="rightdetails my-auto">
        <div class="pack">
            <h1>Choose your KM package</h1>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
            <label class="form-check-label" for="flexCheckDefault">
                Unlimited  kilometers for choosen days
            
             </label>
    </div>
    <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
            <label class="form-check-label" for="flexCheckChecked">
             you will choose distance(st=40km)
             10 rs will be charged for extra kms 
            </label>
    </div>



    
        <!-- Date -->
        <div class="calender mt-4">
            <label for="#">choose date</label><br>
            <input type="date">
        </div>
        <!-- location -->
         <div class="location">
          <label for="location">Location</label><br>
          <input type="">
        </div>


        <div class="button mt-5">
            <button>BOOK VEHICLE</button>
        </div>

      

         </div>

        </div>



        


</div>


   










    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

    
</body>
</html>
